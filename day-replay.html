<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geocaching Days Replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #22262a;
    --muted: #6b7178;
    --line: #e2e0da;
    --accent: #2f6f4f;
    --found: #2e8b57;
    --dnf: #c0392b;
    --event: #2c6fbb;
    --route: #e07b24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
  }

  /* Sidebar */
  #sidebar {
    width: 300px;
    flex: none;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  #sidebar header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  #sidebar h1 { font-size: 17px; margin: 0 0 10px; }
  #sidebar .back { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent);
    text-decoration: none; margin-bottom: 6px; }
  #sidebar .back:hover { text-decoration: underline; }
  #tripHead { margin: -4px 0 10px; }
  #tripHead .trip-name { font-weight: 600; font-size: 15px; }
  #tripHead .trip-dates { color: var(--muted); font-size: 12px; }
  #days li.whole .date { color: var(--accent); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px;
    vertical-align: 0; border: 1px solid rgba(0,0,0,.25); }
  #sidebar .filters { display: flex; gap: 8px; }
  #sidebar select {
    font: inherit;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
  }
  #summary { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #days { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #days li {
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  #days li:hover { background: var(--row-hover); }
  #days li.active { background: var(--row-active); border-left: 4px solid var(--accent); padding-left: 12px; }
  #days li.picked { background: var(--pick); }
  #days li.picked:hover { background: var(--pick-hover); }
  #days li.picked.active { background: var(--pick-active); }

  /* Several days selected: bar at the bottom of the list */
  #selbar {
    flex: none;
    padding: 10px 16px 12px;
    border-top: 1px solid var(--notice-line);
    background: var(--notice-bg);
    font-size: 13px;
  }
  #selbar .count { font-weight: 600; }
  #selbar .range { color: var(--muted); font-size: 12px; margin: 1px 0 8px; }
  #selbar .btns { display: flex; gap: 8px; }
  #selbar button, #dayMenu button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px;
  }
  #selbar .make { padding: 5px 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  #selbar .clear { padding: 5px 12px; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
  #selbar[hidden], #dayMenu[hidden] { display: none; }

  /* Right-click menu on selected days */
  #dayMenu {
    position: fixed; z-index: 2000; min-width: 220px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  #dayMenu button {
    display: block; width: 100%; text-align: left; padding: 7px 10px;
    border: none; background: none; color: var(--ink); font-weight: 500;
  }
  #dayMenu button:hover { background: var(--soft2); }
  #days .date { font-weight: 600; }
  #days .meta { color: var(--muted); font-size: 12px; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #bar #favStar {
    font: 24px/1 sans-serif;
    width: 32px; height: 32px; padding: 0;
    border: none; border-radius: 6px;
    background: none; color: var(--star-off);
    cursor: pointer;
  }
  #bar #favStar:hover:not(:disabled) { background: var(--soft2); }
  #bar #favStar.on { color: #e3a008; }
  #bar #favStar:disabled { opacity: .35; cursor: default; }
  #days .fav { color: #e3a008; margin-left: 4px; }
  #dayTitle { font-size: 16px; font-weight: 600; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #progress { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Finding sequence controls, boxed in the top bar's right-hand corner */
  #sequence {
    margin-left: auto;
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 4px 6px 4px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bar2);
  }
  #bar button {
    font: inherit;
    padding: 5px 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  #bar label { color: var(--muted); }
  #bar select { background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 3px 5px; }
  #mapWrap { flex: 1; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }

  /* Cache panel: opens on the right when a cache is clicked */
  #panel {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: min(400px, 100%);
    z-index: 1000;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -2px 0 10px rgba(0,0,0,.15);
    overflow-y: auto;
    padding: 18px 20px 24px;
  }
  #panel[hidden] { display: none; }
  #panel .close {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px;
    font: 18px/1 sans-serif; color: var(--muted);
    background: none; border: none; border-radius: 6px; cursor: pointer;
  }
  #panel .close:hover { background: var(--hover); color: var(--ink); }
  #panel h2 { font-size: 17px; margin: 0 64px 8px 0; line-height: 1.3; }
  #panel .cstar {
    position: absolute; top: 10px; right: 44px;
    width: 30px; height: 30px; padding: 0;
    font: 22px/1 sans-serif; color: var(--star-off);
    background: none; border: none; border-radius: 6px; cursor: pointer;
  }
  #panel .cstar:hover:not(:disabled) { background: var(--hover); }
  #panel .cstar.on { color: #e3a008; }
  #panel .cstar:disabled { opacity: .35; cursor: default; }
  /* Favourite cache: small gold star on its map marker */
  .stop-box { position: relative; }
  .stop-box .fav-badge {
    position: absolute; top: -9px; right: -9px; font: 15px/1 sans-serif; color: #e3a008;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff;
  }
  #panel .facts { margin: 0 0 4px; }
  #panel .facts a { font-weight: 600; color: var(--accent); }
  #panel .muted { color: var(--muted); }
  #panel .log {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--line);
    overflow-wrap: anywhere;
    font-size: 14px; line-height: 1.5;
  }
  #panel .log .plain { white-space: pre-wrap; }
  #panel .log > :first-child { margin-top: 0; }
  #panel .log > :last-child { margin-bottom: 0; }
  #panel .log p { margin: 0 0 0.9em; }
  #panel .log h1, #panel .log h2, #panel .log h3,
  #panel .log h4, #panel .log h5, #panel .log h6 { font-size: 15px; margin: 1em 0 0.4em; }
  #panel .log h1 { font-size: 17px; }
  #panel .log h2 { font-size: 16px; }
  #panel .log ul, #panel .log ol { margin: 0 0 0.9em; padding-left: 1.4em; }
  #panel .log blockquote { margin: 0 0 0.9em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  #panel .log img { max-width: 100%; height: auto; }
  #panel .log hr { border: none; border-top: 1px solid var(--line); }
  #panel .log a { color: var(--accent); }

  .legend {
    background: var(--legend-bg);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.7;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .legend i {
    display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 6px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.35);
  }

  /* Stop marker: cache-type icon in a box coloured by log type */
  .stop-box {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(0,0,0,.45);
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .stop-box img { width: 28px; height: 28px; display: block; }
  .stop-box .no-icon {
    width: 28px; height: 28px; border-radius: 50%;
    background: #666; color: #fff; font: 600 11px/28px sans-serif; text-align: center;
  }
  .leaflet-popup-content { font-size: 13px; }
  .leaflet-popup-content b { font-size: 14px; }
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>

<aside id="sidebar">
  <header>
    <a class="back" id="backLink" href="index.html">← Dashboard</a>
    <h1>Geocaching Days Replay</h1>
    <div id="tripHead" hidden>
      <div class="trip-name"></div>
      <div class="trip-dates"></div>
    </div>
    <div class="filters">
      <select id="yearFilter" aria-label="Year"></select>
      <select id="monthFilter" aria-label="Month"></select>
    </div>
    <div id="summary"></div>
  </header>
  <ul id="days"></ul>
  <div id="selbar" hidden>
    <div class="count"></div>
    <div class="range"></div>
    <div class="btns">
      <button class="make" type="button">Make a trip</button>
      <button class="clear" type="button">Clear</button>
    </div>
  </div>
</aside>
<div id="dayMenu" hidden role="menu">
  <button type="button" role="menuitem" data-act="trip"></button>
  <button type="button" role="menuitem" data-act="clear">Clear selection</button>
</div>

<section id="main">
  <div id="bar">
    <button id="favStar" type="button" aria-pressed="false" disabled>☆</button>
    <div id="dayTitle">Choose a day</div>
    <span id="progress"></span>
    <div id="sequence" role="group" aria-label="Finding sequence">
      <button id="play" type="button">▶ Play</button>
      <label>Speed
        <select id="speed">
          <option value="2">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="0.4">Fast</option>
        </select>
      </label>
    </div>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <aside id="panel" hidden aria-label="Cache details">
      <button class="cstar" type="button" id="cacheStar" aria-pressed="false">☆</button>
      <button class="close" type="button" aria-label="Close">✕</button>
      <div id="panelBody"></div>
    </aside>
  </div>
</section>

<script src="lib/leaflet.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<script src="data/days.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";

  const DAYS = window.GEOCACHE_DAYS || [];
  const COLORS = { found: "#2e8b57", dnf: "#2c6fbb", note: "#ffffff", route: "#e07b24" };

  // Cache type -> icon in icons/cgeo/ (c:geo icons, Apache License 2.0).
  // Matched on words in the type name; order matters (most specific first).
  const TYPE_ICONS = [
    ["trash out", "cito"],
    ["community celebration", "communceleb"],
    ["block party", "block"],
    ["lost and found", "gchqceleb"],
    ["hq celebration", "gchqceleb"],
    ["mega", "mega"],
    ["giga", "giga"],
    ["event", "event"],
    ["tradition", "traditional"],
    ["multi", "multi"],
    ["unknown", "mystery"],
    ["mystery", "mystery"],
    ["letterbox", "letterbox"],
    ["earth", "earth"],
    ["virtual", "virtual"],
    ["webcam", "webcam"],
    ["wherigo", "wherigo"],
    ["ape", "ape"],
    ["gps adventure", "gps"],
    ["maze", "gps"],
    ["headquarters", "gchq"],
    ["hq", "gchq"],
    ["locationless", "locationless"],
    ["lab", "advlab"]
  ];
  function typeIcon(type) {
    const t = String(type).toLowerCase();
    if (t === "brass cap") return "icons/brasscap.png";
    const hit = TYPE_ICONS.find(r => t.includes(r[0]));
    return "icons/cgeo/" + (hit ? hit[1] : "unknown") + ".svg";
  }

  // ---------- helpers ----------
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function prettyDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return WEEKDAYS[dt.getUTCDay()] + " " + d + " " + MONTHS[m - 1] + " " + y;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Day title from build_days.py (place-name lookup). Falls back to the
  // day's most common province/state if the data has no title.
  function autoTitle(day) {
    if (day.title) return day.title;
    const counts = {};
    for (const s of day.stops) {
      const place = s.state && s.state !== "None"
        ? (s.country && s.country !== "Canada" ? s.state + ", " + s.country : s.state)
        : s.country;
      if (place) counts[place] = (counts[place] || 0) + 1;
    }
    const places = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    return places.slice(0, 2).join(" / ") || "Unknown location";
  }

  // Box colour: green for any find (Found it, Attended, Webcam Photo Taken),
  // blue for Didn't find it, white for a note.
  function stopColor(stop) {
    if (stop.log === "Didn't find it") return COLORS.dnf;
    if (stop.log === "Write note") return COLORS.note;
    return COLORS.found;
  }

  // ---------- map ----------
  const map = L.map("map", { zoomControl: true }).setView([53.54, -113.49], 10);
  // OpenStreetMap tiles. These need the page opened through a local web server
  // (http://localhost:8002/day-replay.html), not double-clicked from disk.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Place names &copy; <a href="https://www.geonames.org">GeoNames</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>) · Boundaries: <a href="https://www.statcan.gc.ca/en/reference/licence">Statistics Canada</a> · Icons from <a href="https://github.com/cgeo/cgeo">c:geo</a> (Apache 2.0)'
  }).addTo(map);
  if (location.protocol === "file:") {
    const note = L.control({ position: "topright" });
    note.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = "Map tiles and favourites need the local server.<br>In Terminal, in this folder: <b>python3 serve.py</b><br>then open <b>http://localhost:8002/day-replay.html</b>";
      return div;
    };
    note.addTo(map);
  }

  const legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML =
      '<div><i style="background:' + COLORS.found + '"></i>Found / attended</div>' +
      '<div><i style="background:' + COLORS.dnf + '"></i>Did not find</div>' +
      '<div><i style="background:' + COLORS.note + '"></i>Note</div>';
    return div;
  };
  legend.addTo(map);

  const dayLayer = L.layerGroup().addTo(map);

  // ---------- sidebar ----------
  const listEl = document.getElementById("days");
  const yearEl = document.getElementById("yearFilter");
  const summaryEl = document.getElementById("summary");

  const monthEl = document.getElementById("monthFilter");
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];

  const years = [...new Set(DAYS.map(d => d.date.slice(0, 4)))];
  yearEl.innerHTML = '<option value="">All years</option>' +
    years.map(y => '<option value="' + y + '">' + y + "</option>").join("");

  // Month list for the chosen year: only months with caching days, newest
  // first, each with its day count. Keeps the given month if that year has it.
  function fillMonths(keep) {
    const year = yearEl.value;
    if (!year) {
      monthEl.innerHTML = '<option value="">All months</option>';
      monthEl.disabled = true;
      return;
    }
    const counts = {};
    for (const d of DAYS) {
      if (d.date.startsWith(year)) {
        const m = d.date.slice(5, 7);
        counts[m] = (counts[m] || 0) + 1;
      }
    }
    const months = Object.keys(counts).sort().reverse();
    monthEl.innerHTML = '<option value="">All months</option>' + months.map(m =>
      '<option value="' + m + '">' + MONTH_NAMES[Number(m) - 1] + " (" + counts[m] +
      (counts[m] === 1 ? " day" : " days") + ")</option>").join("");
    monthEl.disabled = false;
    monthEl.value = counts[keep] ? keep : "";
  }

  // ---------- trips (day-replay.html?trip=ID, from the Trips page) ----------
  // A trip narrows the list to the caching days in its date range, with a
  // "Whole trip" entry that shows every day on one map, each in its own colour.
  let trip = null;
  let tripDayList = [];
  // A place and month from Browse by Location narrows the list the same way
  let place = null;
  const TRIP_COLORS = ["#e07b24", "#7b3fa0", "#1f78b4", "#d6336c", "#2a9d8f", "#b8860b",
    "#5a5ad6", "#c0392b", "#3a7d44", "#8d5524"];
  function tripColor(date) {
    const oldestFirst = tripDayList.map(d => d.date).reverse();
    return TRIP_COLORS[Math.max(0, oldestFirst.indexOf(date)) % TRIP_COLORS.length];
  }

  function renderList() {
    let shown;
    if (trip || place) {
      shown = tripDayList;
    } else {
      const prefix = yearEl.value ? yearEl.value + (monthEl.value ? "-" + monthEl.value : "") : "";
      shown = DAYS.filter(d => d.date.startsWith(prefix));
    }
    const stopCount = shown.reduce((n, d) => n + d.stops.length, 0);
    summaryEl.textContent = shown.length + " caching days, " + stopCount + " stops";
    const whole = trip
      ? '<li class="whole" data-date="trip"><div class="date">Whole trip</div>' +
        '<div class="meta">All ' + Finds.plural(shown.length, "caching day") + " on one map</div></li>"
      : "";
    listEl.innerHTML = whole + shown.map(d => {
      const n = d.stops.length;
      return '<li data-date="' + d.date + '">' +
        '<div class="date">' + (trip ? '<span class="swatch" style="background:' + tripColor(d.date) + '"></span>' : "") +
          prettyDate(d.date) +
          (favorites.has(d.date) ? '<span class="fav" title="Favourite">★</span>' : "") + "</div>" +
        '<div class="meta">' + escapeHtml(autoTitle(d)) + " · " + n + (n === 1 ? " stop" : " stops") + "</div>" +
        "</li>";
    }).join("");
    markActive();
  }

  // ---------- selecting several days (to make a trip) ----------
  // Click: replay that day (and select only it). Shift-click: select every
  // caching day between the last clicked day and this one. Command-click:
  // add or remove one day. Two or more selected days show the trip bar.
  const picked = new Set();
  let anchor = null;
  const selbar = document.getElementById("selbar");
  const dayMenu = document.getElementById("dayMenu");

  function selectOnly(date) {
    picked.clear();
    if (date && date !== "trip") picked.add(date);
    anchor = date;
  }

  function pickedRange() {
    const dates = [...picked].sort();
    return { start: dates[0], end: dates[dates.length - 1], count: dates.length };
  }

  function renderPicked() {
    const many = picked.size >= 2;
    listEl.querySelectorAll("li[data-date]").forEach(li =>
      li.classList.toggle("picked", many && picked.has(li.dataset.date)));
    selbar.hidden = !many;
    if (many) {
      const r = pickedRange();
      selbar.querySelector(".count").textContent = r.count + " days selected";
      selbar.querySelector(".range").textContent = Finds.dateRange(r.start, r.end);
    }
  }

  function makeTrip() {
    if (!picked.size) return;
    const r = pickedRange();
    location.href = "trips.html?start=" + r.start + "&end=" + r.end;
  }

  function clearPicked() {
    selectOnly(currentDate);
    renderPicked();
  }

  listEl.addEventListener("click", e => {
    const li = e.target.closest("li[data-date]");
    if (!li) return;
    const date = li.dataset.date;
    if (date !== "trip" && e.shiftKey && anchor && anchor !== "trip") {
      const [a, b] = [anchor, date].sort();
      DAYS.forEach(d => { if (d.date >= a && d.date <= b && (!(trip || place) || tripDayList.includes(d))) picked.add(d.date); });
      renderPicked();
    } else if (date !== "trip" && e.metaKey) {
      if (picked.has(date)) picked.delete(date); else picked.add(date);
      anchor = date;
      renderPicked();
    } else {
      selectOnly(date);
      selectDay(date);
      renderPicked();
    }
  });

  selbar.querySelector(".make").addEventListener("click", makeTrip);
  selbar.querySelector(".clear").addEventListener("click", clearPicked);

  // Right-click on the selected days
  listEl.addEventListener("contextmenu", e => {
    const li = e.target.closest("li[data-date]");
    if (!li || li.dataset.date === "trip") return;
    e.preventDefault();
    if (!picked.has(li.dataset.date)) { picked.clear(); picked.add(li.dataset.date); renderPicked(); }
    const n = picked.size;
    dayMenu.querySelector('[data-act="trip"]').textContent =
      "Make a trip from " + (n === 1 ? "this day" : "these " + n + " days") + "…";
    dayMenu.hidden = false;
    dayMenu.style.left = Math.min(e.clientX, innerWidth - dayMenu.offsetWidth - 8) + "px";
    dayMenu.style.top = Math.min(e.clientY, innerHeight - dayMenu.offsetHeight - 8) + "px";
  });
  dayMenu.addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    dayMenu.hidden = true;
    if (!act) return;
    if (act.dataset.act === "trip") makeTrip(); else clearPicked();
  });
  document.addEventListener("mousedown", e => { if (!dayMenu.contains(e.target)) dayMenu.hidden = true; });
  listEl.addEventListener("scroll", () => { dayMenu.hidden = true; });
  yearEl.addEventListener("change", () => { fillMonths(monthEl.value); renderList(); });
  monthEl.addEventListener("change", renderList);

  // Up/down arrow keys move between days
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const items = [...listEl.querySelectorAll("li[data-date]")];
    if (!items.length) return;
    let i = items.findIndex(li => li.dataset.date === currentDate);
    i = e.key === "ArrowDown" ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    e.preventDefault();
    selectOnly(items[i].dataset.date);
    selectDay(items[i].dataset.date);
    renderPicked();
  });

  let currentDate = null;

  // ---------- favourites (saved to favorites.json by serve.py) ----------
  const favorites = new Set();
  const favTrips = new Set();     // favourite trip ids
  const favCaches = new Set();    // log ids of favourite cache finds
  const starEl = document.getElementById("favStar");
  let favoritesReady = false;

  function updateStar() {
    const on = currentDate === "trip" ? !!trip && favTrips.has(trip.id) : favorites.has(currentDate);
    starEl.textContent = on ? "★" : "☆";
    starEl.classList.toggle("on", on);
    starEl.setAttribute("aria-pressed", String(on));
    starEl.disabled = !favoritesReady || !currentDate;
    starEl.title = !favoritesReady
      ? "Favourites need the page opened with python3 serve.py"
      : on ? "Remove from favourites" : "Add to favourites";
  }

  async function loadFavorites() {
    try {
      const resp = await fetch("api/favorites", { cache: "no-store" });
      if (!resp.ok) throw new Error(resp.status);
      const j = await resp.json();
      (j.days || []).forEach(d => favorites.add(d));
      (j.trips || []).forEach(id => favTrips.add(id));
      (j.caches || []).forEach(id => favCaches.add(id));
      favoritesReady = true;
    } catch (err) {
      favoritesReady = false;
    }
    renderList();
    updateStar();
    if (typeof updateCacheStar === "function") { updateCacheStar(); pins.forEach((p, id) => refreshPin(id)); }
  }

  async function toggleTripFavorite() {
    const id = trip.id;
    const wasOn = favTrips.has(id);
    if (wasOn) favTrips.delete(id); else favTrips.add(id);
    updateStar();
    try {
      const resp = await fetch("api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ trips: [...favTrips] })
      });
      if (!resp.ok) throw new Error(resp.status);
    } catch (err) {
      if (wasOn) favTrips.add(id); else favTrips.delete(id);
      updateStar();
      alert("Couldn't save the favourite. Is serve.py still running?");
    }
  }

  async function toggleFavorite() {
    if (currentDate === "trip" && trip && favoritesReady) { toggleTripFavorite(); return; }
    if (!currentDate || currentDate === "trip" || !favoritesReady) return;
    const date = currentDate;
    const wasOn = favorites.has(date);
    if (wasOn) favorites.delete(date); else favorites.add(date);
    updateStar();
    renderList();
    try {
      const resp = await fetch("api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days: [...favorites] })
      });
      if (!resp.ok) throw new Error(resp.status);
    } catch (err) {
      if (wasOn) favorites.add(date); else favorites.delete(date);
      updateStar();
      renderList();
      alert("Couldn't save the favourite. Is serve.py still running?");
    }
  }

  starEl.addEventListener("click", toggleFavorite);

  function markActive() {
    listEl.querySelectorAll("li").forEach(li => {
      const on = li.dataset.date === currentDate;
      li.classList.toggle("active", on);
      if (on) li.scrollIntoView({ block: "nearest" });
    });
    if (typeof renderPicked === "function") renderPicked();
  }

  // ---------- animation ----------
  let runToken = 0;
  const titleEl = document.getElementById("dayTitle");
  const progressEl = document.getElementById("progress");
  const speedEl = document.getElementById("speed");

  // Sequence of Daily Finds: "auto" plays the finding sequence as soon as a
  // day is chosen; "manual" shows all the day's caches and waits for Play.
  // Saved in settings.json (to be changed from a future Dashboard page).
  let sequenceMode = "auto";

  function selectDay(date) {
    currentDate = date;
    markActive();
    updateStar();
    if (date === "trip") showTrip();
    else if (sequenceMode === "manual") showAll();
    else play();
  }

  const playEl = document.getElementById("play");
  playEl.addEventListener("click", () => { if (currentDate && currentDate !== "trip") play(); });

  function cacheCount(n) { return n + (n === 1 ? " cache" : " caches"); }

  // Clear the map, title the day and zoom to its caches. Returns the day.
  function startDay() {
    runToken++;
    const day = DAYS.find(d => d.date === currentDate);
    if (!day) return null;
    dayLayer.clearLayers();
    pins.clear();
    closePanel();
    showTripLegend(false);
    playEl.disabled = false;
    titleEl.textContent = prettyDate(day.date) + " — " + autoTitle(day);
    const points = day.stops.map(s => [s.lat, s.lon]);
    if (points.length === 1) {
      map.setView(points[0], 15);
    } else {
      map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 16 });
    }
    return day;
  }

  // Manual mode: all the day's caches at once, no route line
  function showAll() {
    const day = startDay();
    if (!day) return;
    day.stops.forEach((s, i) => addPin(s, i));
    progressEl.textContent = cacheCount(day.stops.length);
  }

  // Whole trip: every caching day's caches and route, each day in its colour
  function showTrip() {
    runToken++;
    dayLayer.clearLayers();
    pins.clear();
    closePanel();
    playEl.disabled = true;
    titleEl.textContent = trip.name + " — " + Finds.dateRange(trip.start, trip.end);
    const stops = tripDayList.flatMap(d => d.stops);
    progressEl.textContent = tripDayList.length
      ? Finds.plural(tripDayList.length, "caching day") + " · " + cacheCount(stops.length)
      : "No caching days in this trip";
    if (!stops.length) { showTripLegend(false); return; }
    const oldestFirst = [...tripDayList].reverse();
    oldestFirst.forEach((day, k) => {
      const color = tripColor(day.date);
      L.polyline(day.stops.map(s => [s.lat, s.lon]), { color: color, weight: 3, opacity: 0.85 }).addTo(dayLayer);
      day.stops.forEach((s, i) => addPin(s, i, {
        day: day, color: color, label: "Day " + (k + 1) + " · " + prettyDate(day.date).slice(0, -5) + " · "
      }));
    });
    const points = stops.map(s => [s.lat, s.lon]);
    if (points.length === 1) map.setView(points[0], 15);
    else map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 16 });
    showTripLegend(true);
  }

  const tripLegend = L.control({ position: "topright" });
  tripLegend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = [...tripDayList].reverse().map((d, k) =>
      '<div><i style="background:' + tripColor(d.date) + '"></i>Day ' + (k + 1) + " · " +
      prettyDate(d.date).slice(0, -5) + "</div>").join("");
    return div;
  };
  let tripLegendShown = false;
  function showTripLegend(on) {
    if (on && !tripLegendShown) tripLegend.addTo(map);
    if (!on && tripLegendShown) tripLegend.remove();
    tripLegendShown = on;
  }

  // Markers on the map now, by log id, so a favourite star can be added or removed
  const pins = new Map();

  function pinIcon(stop, opts) {
    const src = typeIcon(stop.type);
    const inner = src
      ? '<img src="' + src + '" alt="">'
      : '<div class="no-icon">?</div>';
    return L.divIcon({
      className: "",
      html: '<div class="stop-box" style="background:' + stopColor(stop) +
        (opts.color ? ";border:3px solid " + opts.color : "") + '">' + inner +
        (favCaches.has(stop.logId) ? '<span class="fav-badge">★</span>' : "") + "</div>",
      iconSize: [36, 36],
      iconAnchor: [18, 18],
      popupAnchor: [0, -18],
      tooltipAnchor: [0, -18]
    });
  }

  function addPin(stop, index, opts = {}) {
    const icon = pinIcon(stop, opts);
    const marker = L.marker([stop.lat, stop.lon], { icon: icon, zIndexOffset: index }).addTo(dayLayer);
    pins.set(stop.logId, { marker, stop, opts });
    marker.bindTooltip((opts.label || "") + (index + 1) + ". " + escapeHtml(stop.name), { direction: "top" });
    marker.on("click", () => openPanel(stop, index, opts.day));
    return marker;
  }

  // ---------- cache panel ----------
  const panelEl = document.getElementById("panel");
  const panelBody = document.getElementById("panelBody");

  const cacheStarEl = document.getElementById("cacheStar");
  let panelStop = null;

  function updateCacheStar() {
    if (!panelStop) return;
    const on = favCaches.has(panelStop.logId);
    cacheStarEl.textContent = on ? "★" : "☆";
    cacheStarEl.classList.toggle("on", on);
    cacheStarEl.setAttribute("aria-pressed", String(on));
    cacheStarEl.disabled = !favoritesReady || !panelStop.logId;
    cacheStarEl.title = !favoritesReady ? "Favourites need the page opened with python3 serve.py"
      : on ? "Remove this cache from favourites" : "Add this cache to favourites";
  }

  function refreshPin(logId) {
    const p = pins.get(logId);
    if (p && dayLayer.hasLayer(p.marker)) p.marker.setIcon(pinIcon(p.stop, p.opts));
  }

  cacheStarEl.addEventListener("click", async () => {
    if (!panelStop || !favoritesReady) return;
    const id = panelStop.logId;
    const wasOn = favCaches.has(id);
    if (wasOn) favCaches.delete(id); else favCaches.add(id);
    updateCacheStar();
    refreshPin(id);
    try {
      const resp = await fetch("api/favorites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ caches: [...favCaches] })
      });
      if (!resp.ok) throw new Error(resp.status);
    } catch (err) {
      if (wasOn) favCaches.add(id); else favCaches.delete(id);
      updateCacheStar();
      refreshPin(id);
      alert("Couldn't save the favourite. Is serve.py still running?");
    }
  });

  function openPanel(stop, index, day) {
    day = day || DAYS.find(d => d.date === currentDate);
    panelStop = stop;
    const place = stop.town
      ? (stop.near ? "near " : "") + stop.town + (stop.area ? " (" + stop.area + ")" : "")
      : "";
    panelBody.innerHTML =
      "<h2>" + escapeHtml(stop.name) + "</h2>" +
      '<p class="facts"><a href="https://coord.info/' + encodeURIComponent(stop.code) +
        '" target="_blank" rel="noopener">' + escapeHtml(stop.code) + "</a> · " + escapeHtml(stop.type) + "</p>" +
      (place ? '<p class="facts">' + escapeHtml(place) + "</p>" : "") +
      '<p class="facts">' + escapeHtml(stop.log) + " · " + prettyDate(day.date) +
        ' <span class="muted">· stop ' + (index + 1) + " of " + day.stops.length + "</span></p>" +
      (stop.url ? '<p class="facts"><a href="' + escapeHtml(stop.url) + '" target="_blank" rel="noopener">Brass cap page</a></p>' : "") +
      (stop.text
        ? '<div class="log">' + formatLog(stop.text) + "</div>"
        : '<div class="log muted">Log not in My Finds file.</div>');
    panelEl.hidden = false;
    panelEl.scrollTop = 0;
    updateCacheStar();
  }

  // Log text is plain text with Geocaching.com's old formatting codes:
  // [b]bold[/b], [i]italic[/i], [u]underline[/u], [url=...]link[/url].
  function formatLog(text) {
    if (!window.marked || !window.DOMPurify) return '<div class="plain">' + escapeHtml(text) + "</div>";
    // Only "<" is escaped here, so raw HTML in a log shows as text, while
    // Markdown's own quotes and ">" quote marks still work.
    let h = String(text).replace(/</g, "&lt;");
    // Repeat so codes nested inside other codes ([b]..[i]..[/i]..[/b]) convert too
    for (let before = ""; before !== h; ) {
      before = h;
      h = h.replace(/\[(b|i|u|s)\]([\s\S]*?)\[\/\1\]/gi, "<$1>$2</$1>");
    }
    h = h.replace(/\[url=(https?:\/\/[^\]\s]+)\]([\s\S]*?)\[\/url\]/gi,
      '<a href="$1" target="_blank" rel="noopener">$2</a>');
    h = h.replace(/\[url\](https?:\/\/[^\[\s]+)\[\/url\]/gi,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
    // Markdown (**bold**, [links](...), # headings, lists ...), as Geocaching.com
    // shows it. A single line break stays a line break. The result is cleaned
    // by DOMPurify so nothing in a log can run code on the page.
    // "**Bold text **" with a space inside the stars isn't bold in strict
    // Markdown; tidy the spaces so it shows as intended.
    h = h.replace(/\*\*([^*\n]+?)\*\*/g, (m, inner) => inner.trim() ? "**" + inner.trim() + "**" : m);
    h = DOMPurify.sanitize(marked.parse(h, { gfm: true, breaks: true }), { ADD_ATTR: ["target"] });
    const box = document.createElement("div");
    box.innerHTML = h;
    box.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    return box.innerHTML;
  }

  function closePanel() { panelEl.hidden = true; }

  panelEl.querySelector(".close").addEventListener("click", closePanel);
  map.on("click", closePanel);
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closePanel(); dayMenu.hidden = true; } });

  function wait(ms, token) {
    return new Promise(resolve => setTimeout(() => resolve(token === runToken), ms));
  }

  function drawSegment(from, to, ms, token) {
    return new Promise(resolve => {
      const line = L.polyline([from, from], { color: COLORS.route, weight: 3, opacity: 0.9 }).addTo(dayLayer);
      if (ms <= 0) { line.setLatLngs([from, to]); resolve(true); return; }
      const start = performance.now();
      function frame(now) {
        if (token !== runToken) { resolve(false); return; }
        const t = Math.min(1, (now - start) / ms);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        line.setLatLngs([from, [from[0] + (to[0] - from[0]) * eased, from[1] + (to[1] - from[1]) * eased]]);
        if (t < 1) requestAnimationFrame(frame); else resolve(true);
      }
      requestAnimationFrame(frame);
    });
  }

  // The finding sequence: draws the day's route cache by cache.
  // Pressing Play again (e.g. after changing speed) starts it over.
  async function play() {
    const day = startDay();
    if (!day) return;
    const token = runToken;
    const stops = day.stops;
    const points = stops.map(s => [s.lat, s.lon]);
    progressEl.textContent = "0 / " + stops.length;

    // Keep long days watchable: about 30 seconds total at Normal speed
    const factor = Number(speedEl.value);
    const step = Math.max(250, Math.min(1300, 30000 / Math.max(1, stops.length - 1))) * factor;
    const perSegment = step * 0.75;
    const pause = step * 0.25;

    if (!(await wait(400, token))) return;
    addPin(stops[0], 0);
    progressEl.textContent = "1 / " + stops.length;

    for (let i = 1; i < stops.length; i++) {
      if (!(await wait(pause, token))) return;
      const same = points[i - 1][0] === points[i][0] && points[i - 1][1] === points[i][1];
      if (!(await drawSegment(points[i - 1], points[i], same ? 0 : perSegment, token))) return;
      addPin(stops[i], i);
      progressEl.textContent = (i + 1) + " / " + stops.length;
    }
    if (!(await wait(800, token))) return;
    progressEl.textContent = cacheCount(stops.length);
  }

  async function loadSettings() {
    try {
      const resp = await fetch("api/settings", { cache: "no-store" });
      if (resp.ok) sequenceMode = (await resp.json()).dailyFindsSequence === "manual" ? "manual" : "auto";
    } catch (err) {
      // Not opened through serve.py: keep the default (auto)
    }
  }

  // ---------- start ----------
  if (!DAYS.length) {
    titleEl.textContent = "No data found. Run build_days.py first.";
    return;
  }
  // Open on the day named in the address (day-replay.html?date=2026-10-14,
  // used by the Dashboard's favourites), or else the most recent day.
  const params = new URLSearchParams(location.search);
  const asked = params.get("date");
  const startDate = DAYS.some(d => d.date === asked) ? asked : DAYS[0].date;
  yearEl.value = startDate.slice(0, 4);
  fillMonths(startDate.slice(5, 7));

  // A trip from the Trips page (day-replay.html?trip=ID)
  async function loadTrip(id) {
    try {
      const resp = await fetch("api/trips", { cache: "no-store" });
      if (!resp.ok) return null;
      return ((await resp.json()).trips || []).find(t => t.id === id) || null;
    } catch (err) {
      return null;
    }
  }

  // Narrow the list (used by trips and by places): header, back link, no filters
  function narrowTo(name, dates, backHref, backText) {
    document.querySelector("#sidebar .filters").style.display = "none";
    const head = document.getElementById("tripHead");
    head.hidden = false;
    head.querySelector(".trip-name").textContent = name;
    head.querySelector(".trip-dates").textContent = dates;
    const back = document.getElementById("backLink");
    back.href = backHref;
    back.textContent = backText;
    document.title = name + " – Geocaching Days Replay";
  }

  async function start() {
    const month = params.get("month");
    if (month && /^\d{4}-\d{2}$/.test(month) && params.get("country")) {
      place = {};
      for (const l of Finds.PLACE_LEVELS) if (params.get(l)) place[l] = params.get(l);
      tripDayList = DAYS.filter(d => d.date.startsWith(month) && d.stops.some(s => Finds.inPlace(s, place)));
      if (tripDayList.length) {
        const back = new URLSearchParams(place);
        back.set("year", month.slice(0, 4));
        const monthName = new Date(Date.UTC(+month.slice(0, 4), +month.slice(5) - 1, 1))
          .toLocaleString("en-CA", { month: "long", year: "numeric", timeZone: "UTC" });
        narrowTo(place.town || place.state || place.country, monthName + " · " + Finds.plural(tripDayList.length, "caching day"),
          "location.html?" + back.toString(), "← Browse by Location");
      } else {
        place = null;
      }
    }
    const tripId = params.get("trip");
    if (tripId) {
      trip = await loadTrip(tripId);
      if (trip) {
        tripDayList = Finds.tripDays(trip, DAYS);
        narrowTo(trip.name, Finds.dateRange(trip.start, trip.end), "trips.html", "← Trips");
      }
    }
    renderList();
    loadFavorites();
    await loadSettings();
    const first = trip ? (asked && tripDayList.some(d => d.date === asked) ? asked : "trip")
      : place ? tripDayList[0].date : startDate;
    selectOnly(first);
    selectDay(first);
    const cacheId = Number(params.get("cache"));
    if (cacheId && first !== "trip") {
      const day = DAYS.find(d => d.date === first);
      const i = day ? day.stops.findIndex(s => s.logId === cacheId) : -1;
      if (i >= 0) openPanel(day.stops[i], i, day);
    }
  }
  start();
})();
</script>
</body>
</html>
